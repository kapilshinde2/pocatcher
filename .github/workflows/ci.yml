name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (Maven test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test
        working-directory: pocatcher-api

  ui:
    name: UI (build, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pocatcher-ui/package-lock.json

      - name: Install, build, lint, typecheck
        run: |
          npm ci
          npm run build
          npm run lint
          npm run typecheck
        working-directory: pocatcher-ui
